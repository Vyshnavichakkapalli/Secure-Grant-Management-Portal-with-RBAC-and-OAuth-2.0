version: '3.8'

services:
  # =========================================================================
  # 1. PostgreSQL Database Service
  # =========================================================================
  db:
    image: postgres:16-alpine
    container_name: grant_portal_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-grant_portal_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-grant_portal_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - grant_portal_network

  # =========================================================================
  # 2. Redis Caching & Session Service
  # =========================================================================
  cache:
    image: redis:7-alpine
    container_name: grant_portal_cache
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - grant_portal_network

  # =========================================================================
  # 3. Main Application Service (Node.js / Express MVC)
  # =========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: grant_portal_app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-grant_portal_db}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-grant_portal_db}
      REDIS_URL: redis://cache:6379
      REDIS_HOST: cache
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-dev_secure_grant_portal_jwt_secret_key_2026_x!}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      OAUTH_PROVIDER: ${OAUTH_PROVIDER:-google}
      OAUTH_CLIENT_ID: ${OAUTH_CLIENT_ID:-dev-mock-client-id.apps.googleusercontent.com}
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-dev-mock-client-secret}
      OAUTH_REDIRECT_URI: ${OAUTH_REDIRECT_URI:-http://localhost:5000/api/auth/google/callback}
      DEFAULT_ADMIN_NAME: ${DEFAULT_ADMIN_NAME:-Portal Administrator}
      DEFAULT_ADMIN_EMAIL: ${DEFAULT_ADMIN_EMAIL:-admin@grantportal.com}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-AdminPassword123!}
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - grant_portal_network

volumes:
  postgres_data:
  redis_data:

networks:
  grant_portal_network:
    driver: bridge
